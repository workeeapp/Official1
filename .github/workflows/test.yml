name: Test

on:
  push:
    branches: [main, master, "feat/**", "test/**", "fix/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Which package tests to run
        required: true
        default: all
        type: choice
        options:
          - all
          - shared
          - backend
          - frontend

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test (${{ github.event.inputs.suite || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://workee:workee@localhost:5432/workee_test
      AUTH_SECRET: test-auth-secret-that-is-at-least-32-chars
      CLIENT_ORIGIN: http://localhost:5173
      PORT: "3001"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Test shared
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'shared' }}
        run: npm test -w shared

      - name: Test backend
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'backend' }}
        run: npm test -w backend

      - name: Test frontend
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'frontend' }}
        run: npm test -w frontend
