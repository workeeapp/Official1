name: Test

on:
  push:
    branches: [main, master, "feat/**", "test/**", "fix/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Which package tests to run
        required: true
        default: all
        type: choice
        options:
          - all
          - shared
          - backend
          - frontend

# One group per event so a manual re-run does not cancel the push job (and vice versa).
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://workee:workee@localhost:5432/workee_test
  AUTH_SECRET: test-auth-secret-that-is-at-least-32-chars
  CLIENT_ORIGIN: http://localhost:5173
  PORT: "3001"

jobs:
  shared:
    name: shared
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'shared' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test -w shared

  backend:
    name: backend
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'backend' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test -w backend

  frontend:
    name: frontend
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'frontend' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test -w frontend
