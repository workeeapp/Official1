name: Test

on:
  push:
    branches: [main, master, "feat/**", "test/**", "fix/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Which package tests to run
        required: true
        default: all
        type: choice
        options:
          - all
          - shared
          - backend
          - frontend

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

env:
  CI: "true"
  NODE_ENV: test
  DATABASE_URL: postgresql://workee:workee@localhost:5432/workee_test
  AUTH_SECRET: test-auth-secret-that-is-at-least-32-chars
  CLIENT_ORIGIN: http://localhost:5173
  PORT: "3001"

jobs:
  shared:
    name: shared
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'shared' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm test -w shared
      - name: Publish test report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: shared tests
          path: shared/test-results/junit.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
          fail-on-error: false
      - name: Upload JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shared-junit
          path: shared/test-results/junit.xml
          if-no-files-found: ignore

  backend:
    name: backend
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'backend' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run tests
        run: npm test -w backend
      - name: Publish test report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: backend tests
          path: backend/test-results/junit.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
          fail-on-error: false
      - name: Upload JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: backend/test-results/junit.xml
          if-no-files-found: ignore

  frontend:
    name: frontend
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'frontend' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm test -w frontend
      - name: Publish test report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: frontend tests
          path: frontend/test-results/junit.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
          fail-on-error: false
      - name: Upload JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-junit
          path: frontend/test-results/junit.xml
          if-no-files-found: ignore
